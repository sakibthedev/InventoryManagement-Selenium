<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Simple Inventory System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-slate-800 mb-2 text-center">Create Account</h1>
        <p class="text-sm text-slate-500 mb-6 text-center">Register for Inventory Access</p>

        <div id="status-message" class="hidden"></div>

        <form id="register-form" class="space-y-4">
            <div>
                <label for="reg-fullname" class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                <input type="text" id="reg-fullname" name="fullname" required placeholder="John Doe"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="reg-email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" id="reg-email" name="email" required placeholder="student@test.com"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="reg-password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="reg-password" name="password" required placeholder="Create password"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" id="register-submit-btn"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition">
                Register
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-600">
            Already have an account? 
            <a href="index.html" id="login-link" class="text-blue-600 hover:underline font-medium">Login here</a>
        </p>
    </div>

    <script src="app.js"></script>
</body>
</html>
