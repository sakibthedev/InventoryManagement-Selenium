<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Simple Inventory System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-slate-800 mb-2 text-center">Inventory System</h1>
        <p class="text-sm text-slate-500 mb-6 text-center">Sign in to manage your stock</p>

        <div id="status-message" class="hidden"></div>

        <form id="login-form" class="space-y-4">
            <div>
                <label for="login-email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" id="login-email" name="email" required placeholder="admin@test.com"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="login-password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="login-password" name="password" required placeholder="admin123"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" id="login-submit-btn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition">
                Login
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-600">
            Don't have an account? 
            <a href="register.html" id="register-link" class="text-blue-600 hover:underline font-medium">Register here</a>
        </p>
        <p class="mt-2 text-center text-xs text-slate-400">
            Default Demo: admin@test.com / admin123
        </p>
    </div>

    <script src="app.js"></script>
</body>
</html>
