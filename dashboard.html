<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Simple Inventory System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <nav class="bg-slate-800 text-white px-6 py-4 flex justify-between items-center shadow">
        <span class="font-bold text-lg">Inventory Dashboard</span>
        <div class="flex items-center space-x-4">
            <span id="welcome-user" class="text-sm text-slate-300">Welcome</span>
            <button id="logout-btn" class="bg-red-500 hover:bg-red-600 text-white text-sm px-4 py-1.5 rounded-lg transition">
                Logout
            </button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-6">
        <div id="status-message" class="hidden"></div>

        <!-- Add Item Form -->
        <div class="bg-white p-6 rounded-xl shadow-sm mb-6">
            <h2 class="text-lg font-semibold text-slate-800 mb-4">Add New Item</h2>
            <form id="add-item-form" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="item-name" name="item_name" required placeholder="Item Name (e.g., Mouse)"
                    class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" id="item-category" name="category" required placeholder="Category (e.g., Tech)"
                    class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="number" id="item-quantity" name="quantity" required min="1" placeholder="Quantity"
                    class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" id="add-item-btn"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition">
                    Add Item
                </button>
            </form>
        </div>

        <!-- Inventory Table -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b">
                <h2 class="text-lg font-semibold text-slate-800">Current Stock</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-600 text-sm uppercase border-b">
                            <th class="py-3 px-4">Item Name</th>
                            <th class="py-3 px-4">Category</th>
                            <th class="py-3 px-4">Quantity</th>
                            <th class="py-3 px-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-list" class="text-sm">
                        <!-- Items injected by app.js -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
